<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

    <link rel="stylesheet" href="form.css">
</head>
<body>

<div class="container">

    <h1>Create Account</h1>
    
    <input
        type="text"
        id="name"
        placeholder="Full Name">

    <input
        type="email"
        id="email"
        placeholder="Email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="signup()">
        Sign Up
    </button>

    <p id="message"></p>

    <p>
        Already have an account?

        <a href="login.html">

            Login

        </a>
    </p>

</div>
<script src="auth.js"></script>

</body>
</html>
